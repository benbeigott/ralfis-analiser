kind = "web"
previewPath = "/"
title = "RALFIS ANALiser"
version = "1.0.0"
id = "artifacts/music-analyzer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22782
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/music-analyzer run dev"

[services.env]
PORT = "22782"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/music-analyzer", "run", "build"]
publicDir = "artifacts/music-analyzer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
